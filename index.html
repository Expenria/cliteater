<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Interactive Canvas Page</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family:'Inter',sans-serif; background:#0f0f11; color:#f3f4f6; overflow-x:hidden; }
    [contenteditable="true"]:focus { outline:2px dashed rgba(99,102,241,.5); outline-offset:4px; border-radius:4px; }
    .edit-block { position:relative; transition:all .2s ease; }
    .is-editing .edit-block:hover { background:rgba(255,255,255,.03); border-radius:6px; }
    ::-webkit-scrollbar { width:8px; }
    ::-webkit-scrollbar-track { background:#0f0f11; }
    ::-webkit-scrollbar-thumb { background:#27272a; border-radius:4px; }
    ::-webkit-scrollbar-thumb:hover { background:#3f3f46; }
    #star-canvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:1; pointer-events:none; }
    #flash-overlay { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:200; }
    #flash-overlay.flash { animation:flashAnim 700ms ease-out; }
    @keyframes flashAnim { 0%{opacity:0} 12%{opacity:.95} 100%{opacity:0} }
    #image-layer { position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:20; }
    #image-layer .draggable-img { position:absolute; pointer-events:auto; user-select:none; touch-action:none; }
    #image-layer .draggable-img img { width:100%; height:100%; object-fit:cover; display:block; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); pointer-events:none; }
    .resize-handle { position:absolute; right:-8px; bottom:-8px; width:18px; height:18px; background:#6366f1; border:2px solid #fff; border-radius:50%; cursor:nwse-resize; display:none; box-shadow:0 2px 6px rgba(0,0,0,.4); }
    .delete-btn { position:absolute; right:-10px; top:-10px; width:24px; height:24px; background:#ef4444; color:#fff; border-radius:50%; display:none; align-items:center; justify-content:center; font-size:11px; cursor:pointer; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4); }
    body.is-editing #image-layer .draggable-img:hover .resize-handle,
    body.is-editing #image-layer .draggable-img:hover .delete-btn,
    body.is-editing #image-layer .draggable-img.selected .resize-handle,
    body.is-editing #image-layer .draggable-img.selected .delete-btn { display:flex; }
    body.is-editing #image-layer .draggable-img.selected img { outline:2px dashed #6366f1; outline-offset:2px; }
    body.is-editing.dragover-file main::after { content:"Drop image to add it"; position:fixed; inset:0; background:rgba(99,102,241,.15); border:3px dashed #6366f1; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#a5b4fc; pointer-events:none; z-index:30; }

    /* ===== STAR GUI ===== */
    #star-gui {
        position:fixed; top:80px; right:16px; width:340px;
        max-height:calc(100vh - 100px); overflow-y:auto;
        background:#18181b; border:1px solid #27272a; border-radius:14px;
        z-index:60; font-size:11px; box-shadow:0 20px 50px rgba(0,0,0,.6);
    }
    #star-gui.hidden { display:none; }
    #star-gui .gui-header {
        padding:12px 14px; border-bottom:1px solid #27272a;
        display:flex; align-items:center; justify-content:space-between;
        position:sticky; top:0; background:#18181b; z-index:2;
    }
    #star-gui .gui-body { padding:12px 14px 20px; display:flex; flex-direction:column; gap:10px; }

    /* Collapsible sections */
    .gui-section { border:1px solid #27272a; border-radius:10px; overflow:hidden; }
    .gui-section-header {
        padding:8px 10px; background:#1f1f24; cursor:pointer;
        display:flex; justify-content:space-between; align-items:center;
        font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
        user-select:none;
    }
    .gui-section-header.base { color:#f0abfc; }
    .gui-section-header.spawned { color:#a5b4fc; }
    .gui-section-header.global { color:#6ee7b7; }
    .gui-section-header .chev { transition:transform .2s; color:#71717a; font-size:9px; }
    .gui-section.collapsed .gui-section-header .chev { transform:rotate(-90deg); }
    .gui-section.collapsed .gui-section-body { display:none; }
    .gui-section-body { padding:10px; display:flex; flex-direction:column; gap:9px; background:#161619; }

    .row { display:flex; flex-direction:column; gap:3px; }
    label { color:#a1a1aa; font-weight:500; display:flex; justify-content:space-between; align-items:center; font-size:10.5px; letter-spacing:.02em; }
    label .val { color:#818cf8; font-family:monospace; font-size:11px; }
    input[type="range"] { width:100%; accent-color:#6366f1; height:4px; }
    input[type="color"] { width:100%; height:28px; padding:2px; cursor:pointer; background:#0f0f11; border:1px solid #27272a; border-radius:6px; }
    select {
        width:100%; background:#0f0f11; border:1px solid #27272a; border-radius:6px;
        padding:5px 6px; color:#e4e4e7; font-size:11px; font-family:inherit; cursor:pointer;
    }
    .toggle-switch { position:relative; width:32px; height:18px; background:#3f3f46; border-radius:10px; cursor:pointer; transition:background .2s; flex-shrink:0; }
    .toggle-switch::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; background:#fff; border-radius:50%; transition:transform .2s; }
    .toggle-switch.on { background:#6366f1; }
    .toggle-switch.on::after { transform:translateX(14px); }
    .gui-btn { width:100%; padding:7px; border-radius:8px; font-size:11px; font-weight:500; cursor:pointer; transition:all .15s; border:none; }
    .gui-btn.danger { background:#7f1d1d; color:#fecaca; }
    .gui-btn.danger:hover { background:#991b1b; }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

<canvas id="star-canvas"></canvas>
<div id="flash-overlay"></div>

<header class="sticky top-0 z-40 bg-[#141417]/80 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3">
  <div class="max-w-5xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></div>
      <span class="text-sm font-semibold tracking-wide text-zinc-300" id="status-badge">Visitor View</span>
      <span class="text-[10px] text-zinc-500 font-mono" id="star-count">0★</span>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <button id="export-btn" onclick="exportHTML()" class="hidden text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-code"></i> Export Code
      </button>
      <button id="reset-btn" onclick="resetCanvas()" class="hidden text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
      <button id="star-gui-btn" onclick="toggleStarGui()" class="hidden text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/60 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2">
        <i class="fa-solid fa-star"></i> Star Settings
      </button>
      <button id="toggle-edit-btn" onclick="requestEditModeToggle()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/60 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2">
        <i class="fa-solid fa-lock" id="lock-icon"></i> <span id="toggle-text">Admin Login</span>
      </button>
    </div>
  </div>
</header>

<div id="formatting-toolbar" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#1c1c21] border border-zinc-700/80 shadow-2xl rounded-xl p-1.5 flex items-center gap-1 backdrop-blur-lg flex-wrap max-w-[95vw]">
  <button onclick="execCmd('bold')" title="Bold" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-bold"></i></button>
  <button onclick="execCmd('italic')" title="Italic" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-italic"></i></button>
  <button onclick="execCmd('underline')" title="Underline" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-underline"></i></button>
  <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
  <button onclick="addBlock('h1')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg text-xs font-bold transition-all">H1</button>
  <button onclick="addBlock('h2')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg text-xs font-bold transition-all">H2</button>
  <button onclick="addBlock('p')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg text-xs font-bold transition-all">Text</button>
  <button onclick="addBlock('quote')" title="Add Quote" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-quote-left"></i></button>
  <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
  <button onclick="execCmd('justifyLeft')" title="Align Left" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-align-left"></i></button>
  <button onclick="execCmd('justifyCenter')" title="Align Center" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-align-center"></i></button>
  <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
  <button onclick="triggerImageUpload()" title="Upload Image" class="p-2 text-indigo-400 hover:text-white hover:bg-indigo-600 rounded-lg transition-all flex items-center gap-1.5 text-xs font-medium px-3">
    <i class="fa-solid fa-image"></i> Add Image
  </button>
  <input type="file" id="image-upload" accept="image/*" multiple class="hidden">
</div>

<!-- ============ STAR GUI ============ -->
<div id="star-gui" class="hidden">
  <div class="gui-header">
    <span class="text-xs font-bold text-white"><i class="fa-solid fa-star text-indigo-400 mr-1.5"></i>Star Settings</span>
    <button onclick="toggleStarGui()" class="text-zinc-500 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="gui-body">

    <!-- ===== GLOBAL ===== -->
    <div class="gui-section" data-section="global">
      <div class="gui-section-header global" onclick="toggleSection(this)">
        <span><i class="fa-solid fa-globe mr-1.5"></i>Global</span>
        <i class="fa-solid fa-chevron-down chev"></i>
      </div>
      <div class="gui-section-body">
        <div class="row">
          <label>Max stars N (triggers flash) <span class="val" id="v-max">500</span></label>
          <input type="range" id="i-max" min="10" max="3000" step="10" value="500">
        </div>
        <div class="row">
          <label><span>Flash + reset at N <span class="text-zinc-500 text-[10px]">(off by default)</span></span><div class="toggle-switch" id="t-trigger"></div></label>
        </div>
        <button class="gui-btn danger" onclick="resetStars()"><i class="fa-solid fa-bomb mr-1"></i> Reset All Stars</button>
      </div>
    </div>

    <!-- ===== BASE STARS ===== -->
    <div class="gui-section" data-section="base">
      <div class="gui-section-header base" onclick="toggleSection(this)">
        <span><i class="fa-solid fa-circle-nodes mr-1.5"></i>Base Stars</span>
        <i class="fa-solid fa-chevron-down chev"></i>
      </div>
      <div class="gui-section-body">
        <div class="row">
          <label><span>Base stars enabled</span><div class="toggle-switch on" id="t-baseEnabled"></div></label>
        </div>
        <div class="row">
          <label>Initial delay after clear (ms) <span class="val" id="v-baseInitDelay">800</span></label>
          <input type="range" id="i-baseInitDelay" min="0" max="10000" step="50" value="800">
        </div>
        <div class="row">
          <label>Spawn interval (ms) <span class="val" id="v-baseInterval">400</span></label>
          <input type="range" id="i-baseInterval" min="50" max="5000" step="50" value="400">
        </div>
        <div class="row">
          <label>Repro chance per tick <span class="val" id="v-baseRepro">3</span>%</label>
          <input type="range" id="i-baseRepro" min="0" max="100" step="1" value="3">
        </div>
        <div class="row">
          <label>Tick BS (ms) <span class="val" id="v-baseTick">500</span></label>
          <input type="range" id="i-baseTick" min="20" max="3000" step="10" value="500">
        </div>
        <div class="row">
          <label>Lifespan (s) <span class="val" id="v-baseLife">5.0</span></label>
          <input type="range" id="i-baseLife" min="0.3" max="30" step="0.1" value="5">
        </div>
        <div class="row">
          <label>Colour</label>
          <input type="color" id="i-baseColor" value="#ffffff">
        </div>
        <div class="row">
          <label>Shape</label>
          <select id="i-baseShape">
            <option value="square" selected>Square</option>
            <option value="circle">Circle</option>
            <option value="triangle">Triangle</option>
            <option value="diamond">Diamond</option>
            <option value="star">Star</option>
            <option value="plus">Plus</option>
          </select>
        </div>
        <div class="row">
          <label>Size (px) <span class="val" id="v-baseSize">3</span></label>
          <input type="range" id="i-baseSize" min="1" max="20" step="1" value="3">
        </div>
        <div class="row">
          <label>Fade in (s) <span class="val" id="v-baseFadeIn">0.40</span></label>
          <input type="range" id="i-baseFadeIn" min="0" max="3" step="0.05" value="0.4">
        </div>
        <div class="row">
          <label>Fade out (s) <span class="val" id="v-baseFadeOut">0.50</span></label>
          <input type="range" id="i-baseFadeOut" min="0" max="3" step="0.05" value="0.5">
        </div>
        <div class="row">
          <label><span>Mini explosion on death</span><div class="toggle-switch on" id="t-baseFlashOut"></div></label>
        </div>
      </div>
    </div>

    <!-- ===== SPAWNED STARS ===== -->
    <div class="gui-section" data-section="spawned">
      <div class="gui-section-header spawned" onclick="toggleSection(this)">
        <span><i class="fa-solid fa-sparkles mr-1.5"></i>Spawned Stars</span>
        <i class="fa-solid fa-chevron-down chev"></i>
      </div>
      <div class="gui-section-body">
        <div class="row">
          <label><span>Spawned stars enabled</span><div class="toggle-switch on" id="t-spawnedEnabled"></div></label>
        </div>
        <div class="row">
          <label>Repro chance per tick <span class="val" id="v-spawnRepro">5</span>%</label>
          <input type="range" id="i-spawnRepro" min="0" max="100" step="1" value="5">
        </div>
        <div class="row">
          <label>Tick SS (ms) <span class="val" id="v-spawnTick">200</span></label>
          <input type="range" id="i-spawnTick" min="20" max="3000" step="10" value="200">
        </div>
        <div class="row">
          <label>Lifespan (s) <span class="val" id="v-spawnLife">3.0</span></label>
          <input type="range" id="i-spawnLife" min="0.3" max="30" step="0.1" value="3">
        </div>
        <div class="row">
          <label>Colour</label>
          <input type="color" id="i-spawnColor" value="#a5b4fc">
        </div>
        <div class="row">
          <label>Shape</label>
          <select id="i-spawnShape">
            <option value="square" selected>Square</option>
            <option value="circle">Circle</option>
            <option value="triangle">Triangle</option>
            <option value="diamond">Diamond</option>
            <option value="star">Star</option>
            <option value="plus">Plus</option>
          </select>
        </div>
        <div class="row">
          <label>Size (px) <span class="val" id="v-spawnSize">3</span></label>
          <input type="range" id="i-spawnSize" min="1" max="20" step="1" value="3">
        </div>
        <div class="row">
          <label>Fade in (s) <span class="val" id="v-spawnFadeIn">0.40</span></label>
          <input type="range" id="i-spawnFadeIn" min="0" max="3" step="0.05" value="0.4">
        </div>
        <div class="row">
          <label>Fade out (s) <span class="val" id="v-spawnFadeOut">0.50</span></label>
          <input type="range" id="i-spawnFadeOut" min="0" max="3" step="0.05" value="0.5">
        </div>
        <div class="row">
          <label><span>Mini explosion on death</span><div class="toggle-switch on" id="t-spawnFlashOut"></div></label>
        </div>
      </div>
    </div>

  </div>
</div>

<main class="max-w-4xl mx-auto w-full px-6 py-12 flex-grow relative z-10">
  <div id="document-canvas" class="space-y-6">
    <div class="edit-block group relative"><h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">Welcome to My Page</h1></div>
    <div class="edit-block group relative"><p class="text-lg text-zinc-400 font-light leading-relaxed">Admin login → Star Settings to tune the background live.</p></div>
    <div class="edit-block group relative"><blockquote class="border-l-2 border-indigo-500 pl-4 py-1 italic text-zinc-300">"Base stars seed the field. Spawned stars take over."</blockquote></div>
  </div>
  <div id="add-block-container" class="hidden mt-8 text-center border-2 border-dashed border-zinc-800 hover:border-indigo-500/50 rounded-xl p-4 transition-all">
    <button onclick="addBlock('p')" class="text-xs font-medium text-zinc-400 hover:text-indigo-400 flex items-center gap-2 mx-auto"><i class="fa-solid fa-plus"></i> Click to add a new text block</button>
  </div>
</main>

<div id="image-layer"></div>

<div id="password-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4">
    <div class="text-center">
      <div class="w-12 h-12 bg-indigo-600/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-key text-lg"></i></div>
      <h3 class="text-lg font-bold text-white">Enter Password</h3>
      <p class="text-xs text-zinc-400 mt-1">Default password is <span class="text-indigo-400 font-mono">admin</span></p>
    </div>
    <form onsubmit="handlePasswordSubmit(event)" class="space-y-3">
      <input type="password" id="pass-input" placeholder="Password..." class="w-full bg-[#0f0f11] border border-zinc-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all">
      <div class="flex gap-2">
        <button type="button" onclick="closeModal()" class="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-sm font-medium py-2 rounded-xl transition-all">Cancel</button>
        <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium py-2 rounded-xl transition-all">Unlock</button>
      </div>
    </form>
  </div>
</div>

<div id="export-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-6 w-full max-w-2xl shadow-2xl space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-code text-indigo-400 mr-2"></i>Copy HTML for GitHub</h3>
      <button onclick="closeExportModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p class="text-xs text-zinc-400">Paste into <span class="text-indigo-400 font-mono">index.html</span> on GitHub.</p>
    <textarea id="export-textarea" readonly class="w-full h-64 bg-[#0f0f11] border border-zinc-800 rounded-xl p-4 font-mono text-xs text-zinc-300 focus:outline-none resize-none selection:bg-indigo-600"></textarea>
    <div class="flex justify-end"><button onclick="copyExportedCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2 rounded-xl transition-all flex items-center gap-2"><i class="fa-regular fa-copy"></i> Copy to Clipboard</button></div>
  </div>
</div>

<script>
/* =========================================================
   DOC EDIT MODE
========================================================= */
let isEditing = false;
const ADMIN_PASS = "admin";

const canvasEl = document.getElementById('document-canvas');
const imageLayer = document.getElementById('image-layer');
const statusBadge = document.getElementById('status-badge');
const statusDot = document.getElementById('status-dot');
const lockIcon = document.getElementById('lock-icon');
const toggleText = document.getElementById('toggle-text');
const exportBtn = document.getElementById('export-btn');
const resetBtn = document.getElementById('reset-btn');
const addBlockContainer = document.getElementById('add-block-container');
const formattingToolbar = document.getElementById('formatting-toolbar');
const imageUploadInput = document.getElementById('image-upload');
const starGuiBtn = document.getElementById('star-gui-btn');

window.addEventListener('DOMContentLoaded', () => {
  const savedContent = localStorage.getItem('canvas_doc_content');
  if (savedContent) canvasEl.innerHTML = savedContent;
  const savedImages = localStorage.getItem('canvas_images');
  if (savedImages) { try { JSON.parse(savedImages).forEach(img => createImageElement(img)); } catch(e){} }
  disableEditing();
  initStars();
});

function requestEditModeToggle() {
  if (isEditing) { isEditing = false; disableEditing(); }
  else { document.getElementById('password-modal').classList.remove('hidden'); document.getElementById('pass-input').focus(); }
}
function closeModal() { document.getElementById('password-modal').classList.add('hidden'); document.getElementById('pass-input').value = ''; }
function handlePasswordSubmit(e) {
  e.preventDefault();
  if (document.getElementById('pass-input').value === ADMIN_PASS) { isEditing = true; closeModal(); enableEditing(); }
  else alert('Incorrect password!');
}
function enableEditing() {
  document.body.classList.add('is-editing');
  statusBadge.textContent = "Edit Mode Active";
  statusDot.className = "w-3 h-3 rounded-full bg-indigo-500 animate-pulse";
  lockIcon.className = "fa-solid fa-unlock text-indigo-400";
  toggleText.textContent = "Exit Edit Mode";
  exportBtn.classList.remove('hidden');

function addBlock(type) {

  div.className = "edit-block group relative";

  if (type === 'h1') inner = `<h1 class="text-3xl font-bold text-white">New Title Header</h1>`;

  else if (type === 'quote') inner = `<blockquote class="border-l-2 border-indigo-500 pl-4 py-1 italic text-zinc-300">Quote text goes here...</blockquote>`;
  else inner = `<p class="text-base text-zinc-400 font-light leading-relaxed">Click to edit this paragraph text...</p>`;
  div.innerHTML = inner;
  canvasEl.appendChild(div);
  const el = div.firstElementChild;
  el.contentEditable = "true";
  el.addEventListener('input', autoSave);
  el.focus(); autoSave();
}
function autoSave() { localStorage.setItem('canvas_doc_content', canvasEl.innerHTML); }
function execCmd(cmd) { if (!isEditing) return; document.execCommand(cmd, false, null); autoSave(); }
function resetCanvas() {

/* =========================================================
   IMAGE HANDLING
========================================================= */
function triggerImageUpload() { if (isEditing) imageUploadInput.click(); }
imageUploadInput.addEventListener('change', (e) => {
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      createImageElement({ src: ev.target.result, x: Math.max(40, window.innerWidth/2 - 160 + (Math.random()*80-40)), y: 160 + Math.random()*120, width: 320, height: 240 });
      saveImages();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});
document.addEventListener('paste', (e) => {
  if (!isEditing) return;
  const items = e.clipboardData?.items || [];
  for (const item of items) if (item.type.startsWith('image/')) {
    const file = item.getAsFile();
    const reader = new FileReader();
    reader.onload = (ev) => { createImageElement({ src: ev.target.result, x: window.innerWidth/2-160, y: 200, width: 320, height: 240 }); saveImages(); };
    reader.readAsDataURL(file);
  }
});
document.addEventListener('dragover', (e) => {
  if (!isEditing) return;
  if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); document.body.classList.add('dragover-file'); }
});
document.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) document.body.classList.remove('dragover-file'); });
document.addEventListener('drop', (e) => {
  if (!isEditing) return;
  if (e.dataTransfer?.files?.length) {
    e.preventDefault(); document.body.classList.remove('dragover-file');
    Array.from(e.dataTransfer.files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (ev) => { createImageElement({ src: ev.target.result, x: e.clientX-160, y: e.clientY-120, width: 320, height: 240 }); saveImages(); };
      reader.readAsDataURL(file);
    });
  }
});
function createImageElement(data) {
  const wrap = document.createElement('div');
  wrap.className = 'draggable-img';
  wrap.style.left = data.x + 'px';
  wrap.style.top = data.y + 'px';
  wrap.style.width = (data.width || 320) + 'px';
  wrap.style.height = (data.height || 240) + 'px';
  wrap.dataset.src = data.src;
  wrap.innerHTML = `<img src="${data.src}" draggable="false" alt=""><div class="delete-btn" title="Delete"><i class="fa-solid fa-xmark"></i></div><div class="resize-handle" title="Resize"></div>`;
  wrap.querySelector('.delete-btn').addEventListener('click', (e) => {
    e.stopPropagation(); if (!isEditing) return;
    if (confirm('Delete this image?')) { wrap.remove(); saveImages(); }
  });
  let dragging=false, sx=0, sy=0, ol=0, ot=0;
  wrap.addEventListener('mousedown', (e) => {
    if (!isEditing) return;
    if (e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-btn')) return;
    e.preventDefault(); dragging = true; wrap.classList.add('selected');
    document.querySelectorAll('.draggable-img').forEach(d => { if (d !== wrap) d.classList.remove('selected'); });
    sx = e.clientX; sy = e.clientY; ol = parseFloat(wrap.style.left)||0; ot = parseFloat(wrap.style.top)||0;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  function onMove(e) { if (!dragging) return; wrap.style.left = (ol + e.clientX - sx) + 'px'; wrap.style.top = (ot + e.clientY - sy) + 'px'; }
  function onUp() { if (!dragging) return; dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); saveImages(); }
  let resizing=false, rx=0, ry=0, rw=0, rh=0;
  const handle = wrap.querySelector('.resize-handle');
  handle.addEventListener('mousedown', (e) => {
    if (!isEditing) return;
    e.preventDefault(); e.stopPropagation(); resizing = true;
    rx = e.clientX; ry = e.clientY; rw = wrap.offsetWidth; rh = wrap.offsetHeight;
    document.addEventListener('mousemove', onResize);
    document.addEventListener('mouseup', onResizeUp);
  });
  function onResize(e) { if (!resizing) return; wrap.style.width = Math.max(60, rw + e.clientX - rx) + 'px'; wrap.style.height = Math.max(60, rh + e.clientY - ry) + 'px'; }
  function onResizeUp() { if (!resizing) return; resizing = false; document.removeEventListener('mousemove', onResize); document.removeEventListener('mouseup', onResizeUp); saveImages(); }
  imageLayer.appendChild(wrap);
  return wrap;
}
function saveImages() {
  const imgs = Array.from(document.querySelectorAll('.draggable-img')).map(w => ({
    src: w.dataset.src, x: parseFloat(w.style.left)||0, y: parseFloat(w.style.top)||0,
    width: w.offsetWidth, height: w.offsetHeight
  }));
  try { localStorage.setItem('canvas_images', JSON.stringify(imgs)); }
  catch(e) { alert('Storage full — try smaller images.'); }
}
document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('.draggable-img')) document.querySelectorAll('.draggable-img').forEach(d => d.classList.remove('selected'));
});

/* =========================================================
   STAR SYSTEM — per type config
========================================================= */
const cfg = {
  global: {
    maxStars: 500,
    triggerEnabled: false
  },
  base: {
    enabled: true,
    initialDelay: 800,    // ms after last spawned star disappears → first base spawn
    spawnInterval: 400,   // ms between subsequent base spawns
    reproChance: 3,       // % per BS tick
    tickMs: 500,          // BS ms
    lifespan: 5,          // seconds
    color: '#ffffff',
    shape: 'square',
    size: 3,
    fadeIn: 0.4,
    fadeOut: 0.5,
    flashOut: true
  },
  spawned: {
    enabled: true,
    reproChance: 5,       // % per SS tick
    tickMs: 200,          // SS ms
    lifespan: 3,
    color: '#a5b4fc',
    shape: 'square',
    size: 3,
    fadeIn: 0.4,
    fadeOut: 0.5,
    flashOut: true
  }
};

let stars = [];
let starCanvas, starCtx, dpr = 1;
let baseSpawnArmed = false;
let nextBaseSpawnAt = 0;

function initStars() {
  starCanvas = document.getElementById('star-canvas');
  starCtx = starCanvas.getContext('2d');
  resizeStarCanvas();
  window.addEventListener('resize', resizeStarCanvas);
  nextBaseSpawnAt = performance.now() + cfg.base.initialDelay;
  requestAnimationFrame(starLoop);
  bindGui();
}

function resizeStarCanvas() {
  dpr = window.devicePixelRatio || 1;
  starCanvas.width = window.innerWidth * dpr;
  starCanvas.height = window.innerHeight * dpr;
  starCanvas.style.width = window.innerWidth + 'px';
  starCanvas.style.height = window.innerHeight + 'px';
  starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function spawnStar(isBase) {
  const type = isBase ? cfg.base : cfg.spawned;
  const now = performance.now();
  stars.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    isBase,
    birth: now,
    deathStart: now + type.lifespan * 1000,
    nextTick: now + type.tickMs
  });
}

function starLoop() {
  requestAnimationFrame(starLoop);
  const now = performance.now();

  // ---------- Base spawning gate ----------
  // Base stars only spawn while NO spawned stars are alive.
  const hasSpawned = stars.some(s => !s.isBase);

  if (hasSpawned) {
    baseSpawnArmed = false;
  } else {
    if (!baseSpawnArmed) {
      baseSpawnArmed = true;
      const anyBaseAlive = stars.some(s => s.isBase);
      // If base stars already present, resume at regular interval.
      // If field is truly empty, wait the initial delay before the first one.
      nextBaseSpawnAt = now + (anyBaseAlive ? 0 : cfg.base.initialDelay);
    }
    if (cfg.base.enabled && stars.length < cfg.global.maxStars && now >= nextBaseSpawnAt) {
      spawnStar(true);
      nextBaseSpawnAt = now + cfg.base.spawnInterval;
    }
  }

  // ---------- Per-star update ----------
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    const type = s.isBase ? cfg.base : cfg.spawned;

    // Death
    if (now >= s.deathStart + type.fadeOut * 1000) {
      stars.splice(i, 1);
      continue;
    }

    // Reproduction (only before death starts)
    if (now < s.deathStart && now >= s.nextTick) {
      s.nextTick = now + type.tickMs;
      if (cfg.spawned.enabled && stars.length < cfg.global.maxStars) {
        if (Math.random() * 100 < type.reproChance) {
          spawnStar(false); // children are always spawned type
        }
      }
    }
  }

  // ---------- N-star trigger ----------
  if (cfg.global.triggerEnabled && stars.length >= cfg.global.maxStars) {
    flashScreen();
    stars = [];
    baseSpawnArmed = false;
    nextBaseSpawnAt = now + cfg.base.initialDelay;
  }

  renderStars(now);
  updateStarCount();
}

function renderStars(now) {
  const W = window.innerWidth, H = window.innerHeight;
  starCtx.clearRect(0, 0, W, H);

  for (const s of stars) {
    const type = s.isBase ? cfg.base : cfg.spawned;
    const fadeInMs = Math.max(1, type.fadeIn * 1000);
    const fadeOutMs = Math.max(1, type.fadeOut * 1000);

    let alpha = 1;
    let size = type.size;

    if (now < s.birth + fadeInMs) {
      alpha = (now - s.birth) / fadeInMs;
    } else if (now >= s.deathStart) {
      const t = (now - s.deathStart) / fadeOutMs; // 0..1
      if (type.flashOut) {
        alpha = Math.pow(1 - t, 2);
        size = type.size * (1 + t * 2.5);
      } else {
        alpha = 1 - t;
      }
    }

    if (alpha <= 0) continue;
    starCtx.globalAlpha = Math.min(1, alpha);
    starCtx.fillStyle = type.color;
    drawShape(starCtx, s.x, s.y, size, type.shape);
  }
  starCtx.globalAlpha = 1;
}

function drawShape(ctx, x, y, s, shape) {
  const half = s / 2;
  ctx.beginPath();
  switch (shape) {
    case 'circle':
      ctx.arc(x, y, half, 0, Math.PI * 2);
      ctx.fill();
      return;
    case 'square':
      ctx.fillRect(x - half, y - half, s, s);
      return;
    case 'triangle':
      ctx.moveTo(x, y - s * 0.62);
      ctx.lineTo(x + s * 0.58, y + s * 0.42);
      ctx.lineTo(x - s * 0.58, y + s * 0.42);
      ctx.closePath();
      ctx.fill();
      return;
    case 'diamond':
      ctx.moveTo(x, y - s * 0.65);
      ctx.lineTo(x + s * 0.65, y);
      ctx.lineTo(x, y + s * 0.65);
      ctx.lineTo(x - s * 0.65, y);
      ctx.closePath();
      ctx.fill();
      return;
    case 'star':
      for (let i = 0; i < 10; i++) {
        const r = (i % 2 === 0) ? s * 0.72 : s * 0.30;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      return;
    case 'plus': {
      const t = Math.max(1, s * 0.34);
      ctx.fillRect(x - t / 2, y - half, t, s);
      ctx.fillRect(x - half, y - t / 2, s, t);
      return;
    }
    default:
      ctx.fillRect(x - half, y - half, s, s);
  }
}

let lastCountShown = -1;
function updateStarCount() {
  if (stars.length !== lastCountShown) {
    lastCountShown = stars.length;
    const baseCount = stars.filter(s => s.isBase).length;
    const spawnCount = stars.length - baseCount;
    document.getElementById('star-count').textContent = `${stars.length}★ (${baseCount}B / ${spawnCount}S)`;
  }
}

function flashScreen() {
  const el = document.getElementById('flash-overlay');
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}
function resetStars() {
  stars = [];
  baseSpawnArmed = false;
  nextBaseSpawnAt = performance.now() + cfg.base.initialDelay;
}

/* =========================================================
   STAR GUI WIRING
========================================================= */
function toggleStarGui() {
  if (!isEditing) return;
  document.getElementById('star-gui').classList.toggle('hidden');
}
function toggleSection(headerEl) {
  headerEl.parentElement.classList.toggle('collapsed');
}

function bindGui() {
  // ---- Slider binder ----
  const bindSlider = (id, obj, key, fmt) => {
    const input = document.getElementById('i-' + id);
    const label = document.getElementById('v-' + id);
    const apply = () => {
      obj[key] = parseFloat(input.value);
      if (label) label.textContent = fmt ? fmt(obj[key]) : obj[key];
    };
    input.addEventListener('input', apply);
    apply();
  };
  // ---- Color binder ----
  const bindColor = (id, obj, key) => {
    const input = document.getElementById('i-' + id);
    input.addEventListener('input', () => obj[key] = input.value);
    obj[key] = input.value;
  };
  // ---- Select binder ----
  const bindSelect = (id, obj, key) => {
    const el = document.getElementById('i-' + id);
    el.addEventListener('change', () => obj[key] = el.value);
    obj[key] = el.value;
  };
  // ---- Toggle binder ----
  const bindToggle = (id, obj, key, initial) => {
    const el = document.getElementById('t-' + id);
    if (initial) el.classList.add('on'); else el.classList.remove('on');
    obj[key] = initial;
    el.addEventListener('click', () => {
      el.classList.toggle('on');
      obj[key] = el.classList.contains('on');
    });
  };

  // ---------- Global ----------
  bindSlider('max', cfg.global, 'maxStars');
  bindToggle('trigger', cfg.global, 'triggerEnabled', false);

  // ---------- Base ----------
  bindToggle('baseEnabled', cfg.base, 'enabled', true);
  bindSlider('baseInitDelay', cfg.base, 'initialDelay');
  bindSlider('baseInterval',  cfg.base, 'spawnInterval');
  bindSlider('baseRepro',     cfg.base, 'reproChance');
  bindSlider('baseTick',      cfg.base, 'tickMs');
  bindSlider('baseLife',      cfg.base, 'lifespan',  v => v.toFixed(1));
  bindSlider('baseSize',      cfg.base, 'size');
  bindSlider('baseFadeIn',    cfg.base, 'fadeIn',    v => v.toFixed(2));
  bindSlider('baseFadeOut',   cfg.base, 'fadeOut',   v => v.toFixed(2));
  bindColor ('baseColor',     cfg.base, 'color');
  bindSelect('baseShape',     cfg.base, 'shape');
  bindToggle('baseFlashOut',  cfg.base, 'flashOut',  true);

  // ---------- Spawned ----------
  bindToggle('spawnedEnabled', cfg.spawned, 'enabled', true);
  bindSlider('spawnRepro',     cfg.spawned, 'reproChance');
  bindSlider('spawnTick',      cfg.spawned, 'tickMs');
  bindSlider('spawnLife',      cfg.spawned, 'lifespan',  v => v.toFixed(1));
  bindSlider('spawnSize',      cfg.spawned, 'size');
  bindSlider('spawnFadeIn',    cfg.spawned, 'fadeIn',    v => v.toFixed(2));
  bindSlider('spawnFadeOut',   cfg.spawned, 'fadeOut',   v => v.toFixed(2));
  bindColor ('spawnColor',     cfg.spawned, 'color');
  bindSelect('spawnShape',     cfg.spawned, 'shape');
  bindToggle('spawnFlashOut',  cfg.spawned, 'flashOut',  true);
}
