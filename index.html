<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Interactive Canvas Page</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0f0f11;color:#f3f4f6;overflow-x:hidden}
[contenteditable="true"]:focus{outline:2px dashed rgba(99,102,241,.5);outline-offset:4px;border-radius:4px}
.edit-block{position:relative;transition:all .2s ease}
.is-editing .edit-block:hover{background:rgba(255,255,255,.03);border-radius:6px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0f0f11}
::-webkit-scrollbar-thumb{background:#27272a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3f3f46}
#star-canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}
#bubble-editor-layer{position:fixed;inset:0;z-index:25;pointer-events:none}
#bubble-editor-layer .char-editor{position:absolute;border:1px dashed rgba(99,102,241,.55);background:rgba(99,102,241,.05);cursor:move;pointer-events:auto;box-sizing:border-box;transition:border-color .15s, background .15s}
#bubble-editor-layer .char-editor:hover{border-color:#818cf8;background:rgba(99,102,241,.12)}
#bubble-editor-layer .char-rotate-handle{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#6366f1;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:auto}
#bubble-editor-layer .char-rotate-handle:active{cursor:grabbing;background:#818cf8}
#bubble-editor-layer .char-label{position:absolute;top:-18px;left:0;font-size:9px;color:#a5b4fc;font-family:ui-monospace,monospace;background:#1a1938;padding:1px 4px;border-radius:3px;pointer-events:none}
#flash-overlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200}
#flash-overlay.flash{animation:flashAnim 700ms ease-out}
@keyframes flashAnim{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
#image-layer{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:20}
#image-layer .draggable-img{position:absolute;pointer-events:auto;user-select:none;touch-action:none}
#image-layer .draggable-img img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none}
.resize-handle{position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;background:#6366f1;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;display:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.delete-btn{position:absolute;right:-10px;top:-10px;width:24px;height:24px;background:#ef4444;color:#fff;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
body.is-editing #image-layer .draggable-img:hover .resize-handle,
body.is-editing #image-layer .draggable-img:hover .delete-btn,
body.is-editing #image-layer .draggable-img.selected .resize-handle,
body.is-editing #image-layer .draggable-img.selected .delete-btn{display:flex}
body.is-editing #image-layer .draggable-img.selected img{outline:2px dashed #6366f1;outline-offset:2px}
body.is-editing.dragover-file main::after{content:"Drop image to add it";position:fixed;inset:0;background:rgba(99,102,241,.15);border:3px dashed #6366f1;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#a5b4fc;pointer-events:none;z-index:30}
#star-gui{position:fixed;top:80px;right:16px;width:420px;max-height:calc(100vh - 100px);overflow-y:auto;background:#18181b;border:1px solid #27272a;border-radius:14px;z-index:60;font-size:11px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#star-gui.hidden{display:none}
#star-gui .gui-header{padding:12px 14px;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#18181b;z-index:2}
#star-gui .gui-body{padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px}
.gui-section{border:1px solid #27272a;border-radius:10px;overflow:hidden}
.gui-section-header{padding:8px 10px;background:#1f1f24;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;user-select:none}
.gui-section-header.base{color:#f0abfc}
.gui-section-header.spawned{color:#a5b4fc}
.gui-section-header.global{color:#6ee7b7}
.gui-section-header.effects{color:#fbbf24}
.gui-section-header .chev{transition:transform .2s;color:#71717a;font-size:9px}
.gui-section.collapsed .gui-section-header .chev{transform:rotate(-90deg)}
.gui-section.collapsed .gui-section-body{display:none}
.gui-section-body{padding:10px;display:flex;flex-direction:column;gap:9px;background:#161619}
.row{display:flex;flex-direction:column;gap:3px}
.row>label{color:#a1a1aa;font-weight:500;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.02em;gap:8px}
.row>label .lbl-text{flex:1}
input.num-inline{width:88px;background:#0f0f11;border:1px solid #27272a;border-radius:5px;padding:2px 6px;color:#a5b4fc;font-family:ui-monospace,monospace;font-size:11px;text-align:right}
input.num-inline:focus{outline:none;border-color:#6366f1}
input[type="range"]{width:100%;accent-color:#6366f1;height:4px}
input[type="color"]{width:100%;height:28px;padding:2px;cursor:pointer;background:#0f0f11;border:1px solid #27272a;border-radius:6px}
input[type="text"],textarea.gui-text{width:100%;background:#0f0f11;border:1px solid #27272a;border-radius:6px;padding:5px 7px;color:#e4e4e7;font-size:11px;font-family:inherit}
input[type="text"]:focus,textarea.gui-text:focus{outline:none;border-color:#6366f1}
textarea.gui-text{resize:vertical;min-height:50px;font-family:ui-monospace,monospace}
select{width:100%;background:#0f0f11;border:1px solid #27272a;border-radius:6px;padding:5px 6px;color:#e4e4e7;font-size:11px;font-family:inherit;cursor:pointer}
.toggle-switch{position:relative;width:32px;height:18px;background:#3f3f46;border-radius:10px;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle-switch.on{background:#6366f1}
.toggle-switch.on::after{transform:translateX(14px)}
.gui-btn{width:100%;padding:7px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;border:none}
.gui-btn.danger{background:#7f1d1d;color:#fecaca}
.gui-btn.danger:hover{background:#991b1b}
.gui-btn.primary{background:#6366f1;color:#fff}
.gui-btn.primary:hover{background:#818cf8}
.gui-btn.ghost{background:#27272a;color:#d4d4d8}
.gui-btn.ghost:hover{background:#3f3f46}
.effect-item{display:flex;flex-direction:column;background:#1a1a1e;border:1px solid #27272a;border-radius:8px;overflow:hidden}
.effect-item.active{border-color:#6366f1;background:#1a1938}
.effect-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.effect-head:hover{background:rgba(255,255,255,.03)}
.eff-radio{width:14px;height:14px;border-radius:50%;border:2px solid #52525b;flex-shrink:0;position:relative;transition:border-color .15s}
.effect-item.active .eff-radio{border-color:#818cf8}
.effect-item.active .eff-radio::after{content:'';position:absolute;inset:2px;background:#818cf8;border-radius:50%}
.effect-name{flex:1;font-size:11.5px;color:#e4e4e7;font-weight:500}
.effect-type{font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;background:#27272a;border-radius:4px}
.effect-del{color:#71717a;font-size:12px;padding:2px 4px;cursor:pointer}
.effect-del:hover{color:#ef4444}
.effect-settings{padding:10px;display:flex;flex-direction:column;gap:9px;border-top:1px solid #27272a;background:#141416}
.char-header-row{display:grid;grid-template-columns:36px 1fr 1fr 1fr 1fr 20px;gap:3px;font-size:9px;color:#71717a;text-align:center;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:0 1px}
.char-row{display:grid;grid-template-columns:36px 1fr 1fr 1fr 1fr 20px;gap:3px;align-items:center;margin-bottom:3px}
.char-row input.mini{width:100%;background:#0f0f11;border:1px solid #27272a;border-radius:4px;padding:3px 2px;color:#a5b4fc;font-size:10px;text-align:center;font-family:ui-monospace,monospace}
.char-row input.mini:focus{outline:none;border-color:#6366f1}
.char-row input.char-glyph{color:#f0abfc;font-weight:700}
.char-del{width:20px;height:22px;font-size:11px;background:#3f3f46;color:#a1a1aa;border:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.char-del:hover{background:#7f1d1d;color:#fecaca}
.status-tag{font-size:9.5px;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px}
.status-tag.ok{background:#052e16;color:#86efac}
.status-tag.err{background:#450a0a;color:#fca5a5}
.status-tag.loading{background:#1e1b4b;color:#a5b4fc}
#effect-picker{display:none;flex-direction:column;gap:6px;padding:8px;background:#1f1f24;border:1px dashed #3f3f46;border-radius:8px}
#effect-picker.open{display:flex}
#effect-picker button{text-align:left;padding:8px 10px;border-radius:6px;background:#27272a;color:#e4e4e7;font-size:11px;cursor:pointer;border:none;transition:background .15s}
#effect-picker button:hover{background:#3f3f46}
</style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

<canvas id="star-canvas"></canvas>
<div id="bubble-editor-layer"></div>
<div id="flash-overlay"></div>

<header class="sticky top-0 z-40 bg-[#141417]/80 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3">
  <div class="max-w-5xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></div>
      <span class="text-sm font-semibold tracking-wide text-zinc-300" id="status-badge">Visitor View</span>
      <span class="text-[10px] text-zinc-500 font-mono" id="star-count">0★</span>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <button id="export-btn" onclick="exportHTML()" class="hidden text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2 shadow-lg shadow-indigo-600/20"><i class="fa-solid fa-code"></i> Export Code</button>
      <button id="reset-btn" onclick="resetCanvas()" class="hidden text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      <button id="star-gui-btn" onclick="toggleStarGui()" class="hidden text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/60 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2"><i class="fa-solid fa-star"></i> Star Settings</button>
      <button id="toggle-edit-btn" onclick="requestEditModeToggle()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/60 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-2"><i class="fa-solid fa-lock" id="lock-icon"></i> <span id="toggle-text">Admin Login</span></button>
    </div>
  </div>
</header>

<div id="formatting-toolbar" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#1c1c21] border border-zinc-700/80 shadow-2xl rounded-xl p-1.5 flex items-center gap-1 backdrop-blur-lg flex-wrap max-w-[95vw]">
  <button onclick="execCmd('bold')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-bold"></i></button>
  <button onclick="execCmd('italic')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-italic"></i></button>
  <button onclick="execCmd('underline')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-underline"></i></button>
  <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
  <button onclick="addBlock('h1')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg text-xs font-bold transition-all">H1</button>
  <button onclick="addBlock('h2')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg text-xs font-bold transition-all">H2</button>
  <button onclick="addBlock('p')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg text-xs font-bold transition-all">Text</button>
  <button onclick="addBlock('quote')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-quote-left"></i></button>
  <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
  <button onclick="execCmd('justifyLeft')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-align-left"></i></button>
  <button onclick="execCmd('justifyCenter')" class="p-2 text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-lg transition-all"><i class="fa-solid fa-align-center"></i></button>
  <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
  <button onclick="triggerImageUpload()" class="p-2 text-indigo-400 hover:text-white hover:bg-indigo-600 rounded-lg transition-all flex items-center gap-1.5 text-xs font-medium px-3"><i class="fa-solid fa-image"></i> Add Image</button>
  <input type="file" id="image-upload" accept="image/*" multiple class="hidden">
</div>

<div id="star-gui" class="hidden">
  <div class="gui-header">
    <span class="text-xs font-bold text-white"><i class="fa-solid fa-star text-indigo-400 mr-1.5"></i>Star Settings</span>
    <button onclick="toggleStarGui()" class="text-zinc-500 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="gui-body" id="gui-body"></div>
</div>

<main class="max-w-4xl mx-auto w-full px-6 py-12 flex-grow relative z-10">
  <div id="document-canvas" class="space-y-6">
    <div class="edit-block group relative"><h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">Welcome to My Page</h1></div>
    <div class="edit-block group relative"><p class="text-lg text-zinc-400 font-light leading-relaxed">Admin login → Star Settings → Effects.</p></div>
    <div class="edit-block group relative"><blockquote class="border-l-2 border-indigo-500 pl-4 py-1 italic text-zinc-300">"Stars seed the field. Effects reshape it."</blockquote></div>
  </div>
  <div id="add-block-container" class="hidden mt-8 text-center border-2 border-dashed border-zinc-800 hover:border-indigo-500/50 rounded-xl p-4 transition-all">
    <button onclick="addBlock('p')" class="text-xs font-medium text-zinc-400 hover:text-indigo-400 flex items-center gap-2 mx-auto"><i class="fa-solid fa-plus"></i> Click to add a new text block</button>
  </div>
</main>

<div id="image-layer"></div>

<div id="password-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4">
    <div class="text-center">
      <div class="w-12 h-12 bg-indigo-600/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-key text-lg"></i></div>
      <h3 class="text-lg font-bold text-white">Enter Password</h3>
      <p class="text-xs text-zinc-400 mt-1">Default is <span class="text-indigo-400 font-mono">admin</span></p>
    </div>
    <form onsubmit="handlePasswordSubmit(event)" class="space-y-3">
      <input type="password" id="pass-input" placeholder="Password..." class="w-full bg-[#0f0f11] border border-zinc-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all">
      <div class="flex gap-2">
        <button type="button" onclick="closeModal()" class="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-sm font-medium py-2 rounded-xl transition-all">Cancel</button>
        <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium py-2 rounded-xl transition-all">Unlock</button>
      </div>
    </form>
  </div>
</div>

<div id="export-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-6 w-full max-w-2xl shadow-2xl space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-code text-indigo-400 mr-2"></i>Copy HTML for GitHub</h3>
      <button onclick="closeExportModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p class="text-xs text-zinc-400">Paste into <span class="text-indigo-400 font-mono">index.html</span> on GitHub.</p>
    <textarea id="export-textarea" readonly class="w-full h-64 bg-[#0f0f11] border border-zinc-800 rounded-xl p-4 font-mono text-xs text-zinc-300 focus:outline-none resize-none selection:bg-indigo-600"></textarea>
    <div class="flex justify-end"><button onclick="copyExportedCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2 rounded-xl transition-all flex items-center gap-2"><i class="fa-regular fa-copy"></i> Copy to Clipboard</button></div>
  </div>
</div>

<script>
/* ===== DOC EDIT MODE ===== */
let isEditing = false;
const ADMIN_PASS = "admin";
const canvasEl=document.getElementById('document-canvas');
const imageLayer=document.getElementById('image-layer');
const statusBadge=document.getElementById('status-badge');
const statusDot=document.getElementById('status-dot');
const lockIcon=document.getElementById('lock-icon');
const toggleText=document.getElementById('toggle-text');
const exportBtn=document.getElementById('export-btn');
const resetBtn=document.getElementById('reset-btn');
const addBlockContainer=document.getElementById('add-block-container');
const formattingToolbar=document.getElementById('formatting-toolbar');
const imageUploadInput=document.getElementById('image-upload');
const starGuiBtn=document.getElementById('star-gui-btn');

window.addEventListener('DOMContentLoaded',()=>{
  const sc=localStorage.getItem('canvas_doc_content');
  if(sc) canvasEl.innerHTML=sc;
  const si=localStorage.getItem('canvas_images');
  if(si){try{JSON.parse(si).forEach(img=>createImageElement(img))}catch(e){}}
  disableEditing();
  initStars();
});

function requestEditModeToggle(){
  if(isEditing){isEditing=false;disableEditing()}
  else{document.getElementById('password-modal').classList.remove('hidden');document.getElementById('pass-input').focus()}
}
function closeModal(){document.getElementById('password-modal').classList.add('hidden');document.getElementById('pass-input').value=''}
function handlePasswordSubmit(e){
  e.preventDefault();
  if(document.getElementById('pass-input').value===ADMIN_PASS){isEditing=true;closeModal();enableEditing()}
  else alert('Incorrect password!');
}
function enableEditing(){
  document.body.classList.add('is-editing');
  statusBadge.textContent="Edit Mode Active";
  statusDot.className="w-3 h-3 rounded-full bg-indigo-500 animate-pulse";
  lockIcon.className="fa-solid fa-unlock text-indigo-400";
  toggleText.textContent="Exit Edit Mode";
  exportBtn.classList.remove('hidden');resetBtn.classList.remove('hidden');
  addBlockContainer.classList.remove('hidden');formattingToolbar.classList.remove('hidden');
  starGuiBtn.classList.remove('hidden');
  makeBlocksEditable();
  rebuildBubbleEditor();
}
function disableEditing(){
  document.body.classList.remove('is-editing');
  statusBadge.textContent="Visitor View";
  statusDot.className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
  lockIcon.className="fa-solid fa-lock";
  toggleText.textContent="Admin Login";
  exportBtn.classList.add('hidden');resetBtn.classList.add('hidden');
  addBlockContainer.classList.add('hidden');formattingToolbar.classList.add('hidden');
  starGuiBtn.classList.add('hidden');
  document.getElementById('star-gui').classList.add('hidden');
  canvasEl.querySelectorAll('.edit-block').forEach(b=>{const e=b.firstElementChild;if(e)e.removeAttribute('contenteditable')});
  document.querySelectorAll('.draggable-img').forEach(d=>d.classList.remove('selected'));
  document.getElementById('bubble-editor-layer').innerHTML='';
}
function makeBlocksEditable(){
  canvasEl.querySelectorAll('.edit-block').forEach(b=>{
    const e=b.firstElementChild;
    if(e){e.contentEditable="true";e.addEventListener('input',autoSave)}
  });
}
function addBlock(type){
  if(!isEditing)return;
  const div=document.createElement('div');div.className="edit-block group relative";
  let inner;
  if(type==='h1')inner=`<h1 class="text-3xl font-bold text-white">New Title Header</h1>`;
  else if(type==='h2')inner=`<h2 class="text-xl font-semibold text-zinc-200">New Subtitle</h2>`;
  else if(type==='quote')inner=`<blockquote class="border-l-2 border-indigo-500 pl-4 py-1 italic text-zinc-300">Quote text goes here...</blockquote>`;
  else inner=`<p class="text-base text-zinc-400 font-light leading-relaxed">Click to edit this paragraph text...</p>`;
  div.innerHTML=inner;canvasEl.appendChild(div);
  const el=div.firstElementChild;el.contentEditable="true";el.addEventListener('input',autoSave);el.focus();autoSave();
}
function autoSave(){localStorage.setItem('canvas_doc_content',canvasEl.innerHTML)}
function execCmd(cmd){if(!isEditing)return;document.execCommand(cmd,false,null);autoSave()}
function resetCanvas(){
  if(confirm("Reset ALL content and images? (Stars are unaffected)")){
    localStorage.removeItem('canvas_doc_content');localStorage.removeItem('canvas_images');location.reload();
  }
}

/* ===== PAGE IMAGES ===== */

  function rup(){if(!rz)return;rz=false;document.removeEventListener('mousemove',rmv);document.removeEventListener('mouseup',rup);saveImages()}

    randomRotation:false
  },
  effects:[],

};
let stars=[];

const imageCache={};

/* ===== EFFECTS ===== */
let effectCounter=0;
function newEffectId(){return 'eff_'+(++effectCounter)+'_'+Math.random().toString(36).slice(2,7)}
function defaultCharFor(i,total){
  const W=window.innerWidth,H=window.innerHeight;
  const c=Math.max(1,total);
  const sp=Math.min(220,(W*0.85)/c);
  return {char:'',x:W/2+(i-(c-1)/2)*sp,y:H/2,size:300,rotation:0};
}
function createEffect(type){
  const id=newEffectId();
  if(type==='bubble'){
    const chars=[];const text='J';
    for(let i=0;i<text.length;i++){const c=defaultCharFor(i,text.length);c.char=text[i];chars.push(c)}
    return {
      id,type,name:'Bubble Text',
      minStarsForBubble:0,
      outlineWidth:4,outlineColor:'#6366f1',
      outlineOpacity:0.5,
      showOutline:true,
      showHandles:true,
      flashColor:'#ffffff',
      chars,
      spawnPoints:null,maskData:null,maskScale:1,maskBounds:null
    };
  }
  if(type==='images'){
    return {
      id,type,name:'Image Stars',
      folder:'strimiges',
      defaultSize:60,
      explicitList:'',
      exceptions:{},
      flashColor:'#8000ff',
      imagePool:[],unusedPool:[],loaded:false,loadError:null
    };
  }
  return {id,type:'none',name:'Plain Stars',flashColor:'#ffffff'};
}
cfg.effects=[createEffect('none')];
cfg.activeEffectId=cfg.effects[0].id;
function getActiveEffect(){return cfg.effects.find(e=>e.id===cfg.activeEffectId)||cfg.effects[0]||null}

/* ===== BUBBLE MASK ===== */
function computeBubbleMask(effect){
  if(!effect||effect.type!=='bubble')return;
  if(!effect.chars||!effect.chars.length){
    effect.spawnPoints=[];effect.maskData=null;effect.maskBounds=null;return;
  }
  const W=window.innerWidth,H=window.innerHeight;
  const scale=0.5;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.floor(W*scale));
  c.height=Math.max(1,Math.floor(H*scale));
  const ctx=c.getContext('2d');
  effect.chars.forEach(ch=>{
    if(!ch.char)return;
    ctx.save();
    ctx.translate(ch.x*scale,ch.y*scale);
    if(ch.rotation)ctx.rotate(ch.rotation*Math.PI/180);
    const size=Math.max(1,ch.size*scale);
    ctx.font=`900 ${size}px 'Arial Black', Arial, sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(ch.char,0,0);
    ctx.restore();
  });
  const imgData=ctx.getImageData(0,0,c.width,c.height);
  const data=imgData.data;
  let minX=c.width,minY=c.height,maxX=0,maxY=0,found=false;
  const points=[];const step=4;
  for(let y=0;y<c.height;y+=step){
    for(let x=0;x<c.width;x+=step){
      if(data[(y*c.width+x)*4+3]>128){
        points.push({x:x/scale,y:y/scale});
        if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;
        found=true;
      }
    }
  }
  effect.spawnPoints=points;
  effect.maskData=imgData;
  effect.maskScale=scale;
  effect.maskBounds=found?{minX:minX/scale,minY:minY/scale,maxX:maxX/scale,maxY:maxY/scale}:null;
}

/* ===== CHARACTER BOUNDS (for editor) ===== */
let _boundsCtx=null;
function getCharBounds(ch){
  if(!ch.char)return {w:20,h:20};
  if(!_boundsCtx)_boundsCtx=document.createElement('canvas').getContext('2d');
  _boundsCtx.font=`900 ${Math.max(1,ch.size)}px 'Arial Black', Arial, sans-serif`;
  const m=_boundsCtx.measureText(ch.char);
  const w=Math.max(m.width,8);
  let h;
  if(m.actualBoundingBoxAscent!==undefined&&m.actualBoundingBoxAscent!==null){
    h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  }else{
    h=ch.size*1.1;
  }
  return {w,h:Math.max(h,8)};
}

/* ===== BUBBLE EDITOR (canvas handles) ===== */
function rebuildBubbleEditor(){
  const layer=document.getElementById('bubble-editor-layer');
  layer.innerHTML='';
  if(!isEditing)return;
  const eff=getActiveEffect();
  if(!eff||eff.type!=='bubble')return;
  if(!eff.showHandles)return;
  if(!eff.chars||!eff.chars.length)return;

  eff.chars.forEach((ch,idx)=>{
    const b=getCharBounds(ch);
    const div=document.createElement('div');
    div.className='char-editor';
    div.dataset.idx=idx;
    div.style.width=b.w+'px';
    div.style.height=b.h+'px';
    div.style.left=(ch.x-b.w/2)+'px';
    div.style.top=(ch.y-b.h/2)+'px';
    div.style.transform=`rotate(${ch.rotation||0}deg)`;

    const label=document.createElement('div');
    label.className='char-label';
    label.textContent=`#${idx+1} ${ch.char||'·'}`;
    div.appendChild(label);

    const rot=document.createElement('div');
    rot.className='char-rotate-handle';
    rot.title='Rotate (drag)';
    rot.innerHTML='<i class="fa-solid fa-rotate-right"></i>';
    div.appendChild(rot);

    // drag to move
    div.addEventListener('mousedown',e=>{
      if(e.target.closest('.char-rotate-handle'))return;
      if(!isEditing)return;
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY;
      const ox=ch.x,oy=ch.y;
      const mv=ev=>{
        ch.x=ox+(ev.clientX-sx);
        ch.y=oy+(ev.clientY-sy);
        updateCharDiv(div,ch);
      };
      const up=()=>{
        document.removeEventListener('mousemove',mv);
        document.removeEventListener('mouseup',up);
        computeBubbleMask(eff);
        renderEffectList();
      };
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    });

    // rotate
    rot.addEventListener('mousedown',e=>{
      if(!isEditing)return;
      e.preventDefault();
      e.stopPropagation();
      const cx=ch.x,cy=ch.y;
      const startAngle=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI;
      const startRot=ch.rotation||0;
      const mv=ev=>{
        const cur=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI;
        ch.rotation=startRot+(cur-startAngle);
        div.style.transform=`rotate(${ch.rotation}deg)`;
      };
      const up=()=>{
        document.removeEventListener('mousemove',mv);
        document.removeEventListener('mouseup',up);
        computeBubbleMask(eff);
        renderEffectList();
      };
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    });

    layer.appendChild(div);
  });
}

function updateCharDiv(div,ch){
  const b=getCharBounds(ch);
  div.style.width=b.w+'px';
  div.style.height=b.h+'px';
  div.style.left=(ch.x-b.w/2)+'px';
  div.style.top=(ch.y-b.h/2)+'px';
  div.style.transform=`rotate(${ch.rotation||0}deg)`;
  const label=div.querySelector('.char-label');
  if(label)label.textContent=`#${parseInt(div.dataset.idx)+1} ${ch.char||'·'}`;
}

window.addEventListener('resize',()=>{
  if(isEditing)rebuildBubbleEditor();
});

/* ===== IMAGE LOADING ===== */
function preloadImage(url){
  return new Promise((resolve,reject)=>{
    if(imageCache[url]&&imageCache[url].complete)return resolve(imageCache[url]);
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{imageCache[url]=img;resolve(img)};
    img.onerror=()=>reject(new Error('Failed: '+url));
    img.src=url;
  });
}
async function loadEffectImages(effect){
  effect.loadError=null;effect.loaded=false;
  effect.imagePool=[];effect.unusedPool=[];
  let filenames=[];
  if(effect.explicitList&&effect.explicitList.trim()){
    filenames=effect.explicitList.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
  }
  if(!filenames.length){
    try{
      const r=await fetch(effect.folder+'/manifest.json',{cache:'no-store'});
      if(r.ok){const j=await r.json();if(Array.isArray(j))filenames=j}
    }catch(e){}
  }
  if(!filenames.length){
    try{
      const r=await fetch(effect.folder+'/',{cache:'no-store'});
      if(r.ok){
        const html=await r.text();
        const re=/href="([^"\/?]+\.(?:png|jpe?g|gif|webp|svg|bmp|avif))"/gi;
        let m;while((m=re.exec(html))!==null)filenames.push(m[1]);
      }
    }catch(e){}
  }
  if(!filenames.length){
    effect.loadError='No images found in "'+effect.folder+'/"';
    renderEffectList();return;
  }
  const urls=filenames.map(f=>/^https?:\/\//.test(f)||f.startsWith('/')?f:effect.folder+'/'+f);
  const loaded=[];
  for(const u of urls){try{await preloadImage(u);loaded.push(u)}catch(e){}}
  effect.imagePool=loaded;
  effect.loaded=loaded.length>0;
  if(!effect.loaded)effect.loadError='Could not load any images.';
  renderEffectList();
}
function pickNextImage(effect){
  if(!effect.imagePool.length)return null;
  if(!effect.unusedPool||effect.unusedPool.length===0){
    effect.unusedPool=[...effect.imagePool];
    for(let i=effect.unusedPool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [effect.unusedPool[i],effect.unusedPool[j]]=[effect.unusedPool[j],effect.unusedPool[i]];
    }
  }
  return effect.unusedPool.pop();
}

/* ===== STAR SYSTEM ===== */
function initStars(){
  starCanvas=document.getElementById('star-canvas');
  starCtx=starCanvas.getContext('2d');
  resizeStarCanvas();
  window.addEventListener('resize',()=>{
    resizeStarCanvas();
    cfg.effects.forEach(e=>{if(e.type==='bubble')computeBubbleMask(e)});
  });
  nextBaseSpawnAt=performance.now()+cfg.base.initialDelay;
  cfg.effects.forEach(e=>{if(e.type==='bubble')computeBubbleMask(e)});
  buildGui();
  requestAnimationFrame(starLoop);
}
function resizeStarCanvas(){
  dpr=window.devicePixelRatio||1;
  starCanvas.width=window.innerWidth*dpr;
  starCanvas.height=window.innerHeight*dpr;
  starCanvas.style.width=window.innerWidth+'px';
  starCanvas.style.height=window.innerHeight+'px';
  starCtx.setTransform(dpr,0,0,dpr,0,0);
}
function getSpawnPoint(effect){
  if(effect&&effect.type==='bubble'&&effect.chars&&effect.chars.length){
    const threshold=Number(effect.minStarsForBubble)||0;
    if(stars.length>=threshold&&effect.maskBounds&&effect.maskData){
      const b=effect.maskBounds;
      const w=b.maxX-b.minX,h=b.maxY-b.minY;
      for(let t=0;t<40;t++){
        const x=b.minX+Math.random()*w;
        const y=b.minY+Math.random()*h;
        const mx=Math.floor(x*effect.maskScale);
        const my=Math.floor(y*effect.maskScale);
        if(mx<0||my<0||mx>=effect.maskData.width||my>=effect.maskData.height)continue;
        const idx=(my*effect.maskData.width+mx)*4+3;
        if(effect.maskData.data[idx]>128)return{x,y};
      }
      if(effect.spawnPoints&&effect.spawnPoints.length){
        const p=effect.spawnPoints[Math.floor(Math.random()*effect.spawnPoints.length)];
        return{x:p.x,y:p.y};
      }
    }
  }
  return{x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight};
}
function spawnStar(isBase){
  const type=isBase?cfg.base:cfg.spawned;
  const active=getActiveEffect();
  const now=performance.now();
  const pt=getSpawnPoint(active);
  let imgUrl=null;
  if(active&&active.type==='images'&&active.imagePool.length){
    imgUrl=pickNextImage(active);
  }
  stars.push({
    x:pt.x,y:pt.y,isBase,
    birth:now,
    deathStart:now+type.lifespan*1000,
    nextTick:now+type.tickMs,
    imgUrl,
    rotation: type.randomRotation ? Math.random()*360 : 0
  });
}
function starLoop(){
  requestAnimationFrame(starLoop);
  const now=performance.now();
  const active=getActiveEffect();
  const hasSpawned=stars.some(s=>!s.isBase);
  if(hasSpawned){baseSpawnArmed=false}
  else{
    if(!baseSpawnArmed){
      baseSpawnArmed=true;
      const anyBase=stars.some(s=>s.isBase);
      nextBaseSpawnAt=now+(anyBase?0:cfg.base.initialDelay);
    }
    if(cfg.base.enabled&&stars.length<cfg.global.maxStars&&now>=nextBaseSpawnAt){
      spawnStar(true);
      nextBaseSpawnAt=now+cfg.base.spawnInterval;
    }
  }
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];
    const type=s.isBase?cfg.base:cfg.spawned;
    if(now>=s.deathStart+type.fadeOut*1000){stars.splice(i,1);continue}
    if(now<s.deathStart&&now>=s.nextTick){
      s.nextTick=now+type.tickMs;
      if(cfg.spawned.enabled&&stars.length<cfg.global.maxStars){
        if(Math.random()*100<type.reproChance)spawnStar(false);
      }
    }
  }
  if(cfg.global.triggerEnabled&&stars.length>=cfg.global.maxStars){
    flashScreen(active?active.flashColor:'#ffffff');
    stars=[];baseSpawnArmed=false;
    nextBaseSpawnAt=now+cfg.base.initialDelay;
  }
  renderStars(now,active);
  updateStarCount();
}
function renderStars(now,active){
  const W=window.innerWidth,H=window.innerHeight;
  starCtx.clearRect(0,0,W,H);
  if(active&&active.type==='bubble'&&active.showOutline&&(active.outlineOpacity??0.5)>0&&active.chars){
    starCtx.save();
    starCtx.strokeStyle=active.outlineColor;
    starCtx.globalAlpha=Math.min(1,Math.max(0,active.outlineOpacity??0.5));
    starCtx.lineWidth=active.outlineWidth;
    active.chars.forEach(ch=>{
      if(!ch.char)return;
      starCtx.save();
      starCtx.translate(ch.x,ch.y);
      if(ch.rotation)starCtx.rotate(ch.rotation*Math.PI/180);
      starCtx.font=`900 ${ch.size}px 'Arial Black', Arial, sans-serif`;
      starCtx.textAlign='center';starCtx.textBaseline='middle';
      starCtx.strokeText(ch.char,0,0);
      starCtx.restore();
    });
    starCtx.restore();
  }
  for(const s of stars){
    const type=s.isBase?cfg.base:cfg.spawned;
    const fi=Math.max(1,type.fadeIn*1000);
    const fo=Math.max(1,type.fadeOut*1000);
    let alpha=1,size=type.size;
    if(now<s.birth+fi)alpha=(now-s.birth)/fi;
    else if(now>=s.deathStart){
      const t=(now-s.deathStart)/fo;
      if(type.flashOut){alpha=Math.pow(1-t,2);size=type.size*(1+t*2.5)}
      else alpha=1-t;
    }
    if(alpha<=0)continue;
    starCtx.globalAlpha=Math.min(1,alpha);
    if(s.imgUrl&&imageCache[s.imgUrl]&&imageCache[s.imgUrl].complete){
      const img=imageCache[s.imgUrl];
      const sSize=(active&&active.exceptions&&active.exceptions[s.imgUrl])||(active?active.defaultSize:60);
      const aspect=img.naturalWidth/img.naturalHeight;
      let dw,dh;
      if(aspect>1){dw=sSize;dh=sSize/aspect}else{dw=sSize*aspect;dh=sSize}
      starCtx.save();
      starCtx.translate(s.x,s.y);
      if(s.rotation)starCtx.rotate(s.rotation*Math.PI/180);
      starCtx.drawImage(img,-dw/2,-dh/2,dw,dh);
      starCtx.restore();
    }else{
      starCtx.save();
      starCtx.translate(s.x,s.y);
      if(s.rotation)starCtx.rotate(s.rotation*Math.PI/180);
      starCtx.fillStyle=type.color;
      drawShape(starCtx,0,0,size,type.shape);
      starCtx.restore();
    }
  }
  starCtx.globalAlpha=1;
}
function drawShape(ctx,x,y,s,shape){
  const h=s/2;ctx.beginPath();
  switch(shape){
    case 'circle':ctx.arc(x,y,h,0,Math.PI*2);ctx.fill();return;
    case 'square':ctx.fillRect(x-h,y-h,s,s);return;
    case 'triangle':ctx.moveTo(x,y-s*0.62);ctx.lineTo(x+s*0.58,y+s*0.42);ctx.lineTo(x-s*0.58,y+s*0.42);ctx.closePath();ctx.fill();return;
    case 'diamond':ctx.moveTo(x,y-s*0.65);ctx.lineTo(x+s*0.65,y);ctx.lineTo(x,y+s*0.65);ctx.lineTo(x-s*0.65,y);ctx.closePath();ctx.fill();return;
    case 'star':
      for(let i=0;i<10;i++){
        const r=(i%2===0)?s*0.72:s*0.30;
        const a=-Math.PI/2+i*Math.PI/5;
        const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.fill();return;
    case 'plus':{
      const t=Math.max(1,s*0.34);
      ctx.fillRect(x-t/2,y-h,t,s);ctx.fillRect(x-h,y-t/2,s,t);return;
    }
    default:ctx.fillRect(x-h,y-h,s,s);
  }
}
let lastCount=-1;
function updateStarCount(){
  if(stars.length!==lastCount){
    lastCount=stars.length;
    const b=stars.filter(s=>s.isBase).length;
    const sp=stars.length-b;
    document.getElementById('star-count').textContent=`${stars.length}★ (${b}B / ${sp}S)`;
  }
}

/* ===== GUI WIDGETS ===== */
function el(tag,cls,html){
  const d=document.createElement(tag);
  if(cls)d.className=cls;
  if(html!==undefined)d.innerHTML=html;
  return d;
}
function widget_numRange(labelText,obj,key,opts={}){
  const row=el('div','row');
  const min=opts.min??0,max=opts.max??100,step=opts.step??1;
  const wrap=el('label');
  const txt=el('span','lbl-text',labelText);
  const num=el('input');num.type='number';num.className='num-inline';num.step='any';
  num.value=obj[key];
  wrap.appendChild(txt);wrap.appendChild(num);
  const rng=el('input');rng.type='range';rng.min=min;rng.max=max;rng.step=step;
  rng.value=Math.min(obj[key],max);
  row.appendChild(wrap);row.appendChild(rng);
  const apply=(v,fromSlider)=>{
    let val=parseFloat(v);
    if(isNaN(val))return;
    if(val<min)val=min;
    if(fromSlider&&val>max)val=max;
    obj[key]=val;num.value=val;rng.value=Math.min(val,max);
    if(opts.onChange)opts.onChange(val);
  };
  num.addEventListener('input',()=>apply(num.value,false));
  num.addEventListener('blur',()=>apply(num.value,false));
  rng.addEventListener('input',()=>apply(rng.value,true));
  return row;
}
function widget_color(labelText,obj,key,onChange){
  const row=el('div','row');
  const wrap=el('label');wrap.appendChild(el('span','lbl-text',labelText));
  const inp=el('input');inp.type='color';inp.value=obj[key];
  inp.addEventListener('input',()=>{obj[key]=inp.value;if(onChange)onChange(inp.value)});
  row.appendChild(wrap);row.appendChild(inp);return row;
}
function widget_select(labelText,obj,key,options,onChange){
  const row=el('div','row');
  const wrap=el('label');wrap.appendChild(el('span','lbl-text',labelText));
  const sel=el('select');
  options.forEach(o=>{
    const opt=el('option',null,o.label);opt.value=o.value;
    if(obj[key]===o.value)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change',()=>{obj[key]=sel.value;if(onChange)onChange(sel.value)});
  row.appendChild(wrap);row.appendChild(sel);return row;
}
function widget_toggle(labelText,obj,key,onChange){
  const row=el('div','row');
  const wrap=el('label');wrap.appendChild(el('span','lbl-text',labelText));
  const tog=el('div','toggle-switch'+(obj[key]?' on':''));
  tog.addEventListener('click',()=>{
    tog.classList.toggle('on');obj[key]=tog.classList.contains('on');
    if(onChange)onChange(obj[key]);
  });
  wrap.appendChild(tog);row.appendChild(wrap);return row;
}
function widget_text(labelText,obj,key,onChange,isArea){
  const row=el('div','row');
  const wrap=el('label');wrap.appendChild(el('span','lbl-text',labelText));
  row.appendChild(wrap);
  const inp=el(isArea?'textarea':'input');
  if(!isArea)inp.type='text';else inp.className='gui-text';
  inp.value=obj[key]||'';
  inp.addEventListener('input',()=>{obj[key]=inp.value;if(onChange)onChange(inp.value)});
  row.appendChild(inp);return row;
}
function makeSection(headerText,headerClass,sectionKey){
  const sec=el('div','gui-section');sec.dataset.section=sectionKey;
  const head=el('div','gui-section-header '+headerClass);
  head.innerHTML=`<span>${headerText}</span><i class="fa-solid fa-chevron-down chev"></i>`;
  head.addEventListener('click',()=>sec.classList.toggle('collapsed'));
  const body=el('div','gui-section-body');
  sec.appendChild(head);sec.appendChild(body);
  return {sec,body};
}

/* ===== EFFECTS LIST ===== */
function renderEffectList(){
  const container=document.getElementById('effects-body');
  if(!container)return;
  container.innerHTML='';

  cfg.effects.forEach(eff=>{
    const item=el('div','effect-item'+(eff.id===cfg.activeEffectId?' active':''));
    const head=el('div','effect-head');
    head.innerHTML=`
      <div class="eff-radio"></div>
      <div class="effect-name">${eff.name}</div>
      <div class="effect-type">${eff.type}</div>
      <div class="effect-del" title="Delete"><i class="fa-solid fa-trash-can"></i></div>
    `;
    head.addEventListener('click',ev=>{
      if(ev.target.closest('.effect-del'))return;
      activateEffect(eff.id);
    });
    head.querySelector('.effect-del').addEventListener('click',ev=>{
      ev.stopPropagation();deleteEffect(eff.id);
    });
    item.appendChild(head);

    if(eff.id===cfg.activeEffectId){
      const settings=el('div','effect-settings');
      buildEffectSettings(settings,eff);
      item.appendChild(settings);
    }
    container.appendChild(item);
  });

  const addBtn=el('button','gui-btn ghost');
  addBtn.innerHTML='<i class="fa-solid fa-plus mr-1"></i> Add Effect';
  addBtn.addEventListener('click',()=>{
    const p=document.getElementById('effect-picker');
    p.classList.toggle('open');
  });
  container.appendChild(addBtn);

  const picker=el('div');
  picker.id='effect-picker';
  picker.innerHTML=`
    <button data-type="bubble"><i class="fa-solid fa-font mr-2"></i> Bubble Text</button>
    <button data-type="images"><i class="fa-solid fa-images mr-2"></i> Image Stars</button>
    <button data-type="none"><i class="fa-solid fa-circle mr-2"></i> Plain Stars (None)</button>
  `;
  picker.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const eff=createEffect(btn.dataset.type);
      cfg.effects.push(eff);
      activateEffect(eff.id);
      picker.classList.remove('open');
      renderEffectList();
    });
  });
  container.appendChild(picker);
}

function buildEffectSettings(container,eff){
  container.appendChild(widget_text('Name',eff,'name',()=>renderEffectList(),false));
  container.appendChild(widget_color('Flash colour at N',eff,'flashColor'));

  if(eff.type==='bubble'){
    container.appendChild(widget_numRange('Stars needed before entering bubble',eff,'minStarsForBubble',{
      min:0,max:100000000,step:1
    }));
    container.appendChild(widget_text('Text',eff,'text',()=>renderEffectList(),false));

    const charsLabel=el('div',null,'<span style="color:#f0abfc;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;">Characters</span>');
    container.appendChild(charsLabel);

    const hdr=el('div','char-header-row',`
      <span>Char</span><span>X</span><span>Y</span><span>Size</span><span>Rot</span><span></span>
    `);
    container.appendChild(hdr);

    const charsBox=el('div');
    charsBox.style.display='flex';charsBox.style.flexDirection='column';
    charsBox.style.maxHeight='340px';charsBox.style.overflowY='auto';
    charsBox.style.padding='4px';charsBox.style.background='#0f0f11';
    charsBox.style.borderRadius='6px';charsBox.style.border='1px solid #27272a';

    eff.chars.forEach((ch,idx)=>{
      const row=el('div','char-row');

      const glyph=el('input','mini char-glyph');
      glyph.type='text';glyph.value=ch.char;glyph.maxLength=3;
      glyph.addEventListener('input',()=>{
        ch.char=glyph.value;
        computeBubbleMask(eff);
        updateCharDivByIndex(idx,ch);
      });

      const xin=el('input','mini');xin.type='number';xin.step='any';xin.value=Math.round(ch.x);
      xin.addEventListener('input',()=>{ch.x=parseFloat(xin.value)||0;computeBubbleMask(eff);updateCharDivByIndex(idx,ch)});
      const yin=el('input','mini');yin.type='number';yin.step='any';yin.value=Math.round(ch.y);
      yin.addEventListener('input',()=>{ch.y=parseFloat(yin.value)||0;computeBubbleMask(eff);updateCharDivByIndex(idx,ch)});
      const sin=el('input','mini');sin.type='number';sin.step='any';sin.value=Math.round(ch.size);
      sin.addEventListener('input',()=>{ch.size=parseFloat(sin.value)||1;computeBubbleMask(eff);updateCharDivByIndex(idx,ch)});
      const rin=el('input','mini');rin.type='number';rin.step='any';rin.value=Math.round(ch.rotation||0);
      rin.addEventListener('input',()=>{ch.rotation=parseFloat(rin.value)||0;computeBubbleMask(eff);updateCharDivByIndex(idx,ch)});

      const del=el('button','char-del');del.innerHTML='<i class="fa-solid fa-xmark"></i>';
      del.title='Remove character';
      del.addEventListener('click',()=>{
        eff.chars.splice(idx,1);
        computeBubbleMask(eff);
        renderEffectList();
        rebuildBubbleEditor();
      });

      row.appendChild(glyph);
      row.appendChild(xin);
      row.appendChild(yin);
      row.appendChild(sin);
      row.appendChild(rin);
      row.appendChild(del);

      charsBox.appendChild(row);
    });

    container.appendChild(charsBox);

    const addCharBtn=el('button','gui-btn ghost');
    addCharBtn.innerHTML='<i class="fa-solid fa-plus mr-1"></i> Add character';
    addCharBtn.addEventListener('click',()=>{
      eff.chars.push(defaultCharFor(eff.chars.length,Math.max(1,eff.chars.length+1)));
      computeBubbleMask(eff);renderEffectList();rebuildBubbleEditor();
    });
    container.appendChild(addCharBtn);

    const reloadLayoutBtn=el('button','gui-btn ghost');
    reloadLayoutBtn.innerHTML='<i class="fa-solid fa-arrows-left-right mr-1"></i> Re-space horizontally';
    reloadLayoutBtn.addEventListener('click',()=>{
      eff.chars.forEach((ch,i)=>{
        const c=defaultCharFor(i,eff.chars.length);
        ch.x=c.x;ch.y=c.y;ch.rotation=0;
      });
      computeBubbleMask(eff);renderEffectList();rebuildBubbleEditor();
    });
    container.appendChild(reloadLayoutBtn);

    const clearRotBtn=el('button','gui-btn ghost');
    clearRotBtn.innerHTML='<i class="fa-solid fa-rotate-left mr-1"></i> Reset all rotations to 0';
    clearRotBtn.addEventListener('click',()=>{
      eff.chars.forEach(ch=>{ch.rotation=0});
      computeBubbleMask(eff);renderEffectList();rebuildBubbleEditor();
    });
    container.appendChild(clearRotBtn);

    const outlineHeader=el('div',null,'<span style="color:#6366f1;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;">Outline guide</span>');
    container.appendChild(outlineHeader);
    container.appendChild(widget_toggle('Show outline guide',eff,'showOutline'));
    container.appendChild(widget_numRange('Outline opacity',eff,'outlineOpacity',{min:0,max:1,step:0.01}));
    container.appendChild(widget_numRange('Outline width',eff,'outlineWidth',{min:0,max:60,step:0.5}));
    container.appendChild(widget_color('Outline colour',eff,'outlineColor'));

    const editorHeader=el('div',null,'<span style="color:#f0abfc;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;">Canvas drag handles</span>');
    container.appendChild(editorHeader);
    container.appendChild(widget_toggle('Show drag handles on canvas',eff,'showHandles',()=>rebuildBubbleEditor()));

    const info=el('div',null,`<span class="status-tag ok">Spawn area: ${eff.spawnPoints?eff.spawnPoints.length:0} sampled px</span>`);
    container.appendChild(info);

    // Hint
    const hint=el('div',null,'<span style="color:#71717a;font-size:10px;">Tip: on the page, drag the dashed box to move a letter, drag the blue circle to rotate.</span>');
    container.appendChild(hint);
  }

  if(eff.type==='images'){
    container.appendChild(widget_text('Folder name',eff,'folder',null,false));
    container.appendChild(widget_text('Manual file list (optional — one per line)',eff,'explicitList',null,true));
    container.appendChild(widget_numRange('Default image size (px)',eff,'defaultSize',{min:8,max:2000,step:1}));
    const rb=el('button','gui-btn primary');
    rb.innerHTML='<i class="fa-solid fa-rotate mr-1"></i> Reload Images';
    rb.addEventListener('click',()=>loadEffectImages(eff));
    container.appendChild(rb);
    const status=el('div');
    if(eff.loaded)status.innerHTML=`<span class="status-tag ok">Loaded ${eff.imagePool.length} images</span>`;
    else if(eff.loadError)status.innerHTML=`<span class="status-tag err">${eff.loadError} — falling back to plain stars</span>`;
    else status.innerHTML=`<span class="status-tag loading">Not loaded yet — click Reload</span>`;
    container.appendChild(status);

    if(eff.imagePool&&eff.imagePool.length){
      const exH=el('div',null,'<span style="color:#a1a1aa;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;">Exceptions (custom sizes)</span>');
      container.appendChild(exH);
      const exBox=el('div');
      exBox.style.maxHeight='160px';exBox.style.overflowY='auto';
      exBox.style.display='flex';exBox.style.flexDirection='column';exBox.style.gap='4px';
      exBox.style.padding='6px';exBox.style.background='#0f0f11';
      exBox.style.borderRadius='6px';exBox.style.border='1px solid #27272a';
      eff.imagePool.forEach(url=>{
        const fn=url.split('/').pop();
        const r=el('div');r.style.display='flex';r.style.alignItems='center';r.style.gap='6px';r.style.fontSize='10.5px';
        const isEx=eff.exceptions[url]!==undefined;
        const tog=el('input');tog.type='checkbox';tog.checked=isEx;tog.style.accentColor='#6366f1';
        const lbl=el('span',null,fn);lbl.style.flex='1';lbl.style.color='#a1a1aa';lbl.style.overflow='hidden';lbl.style.textOverflow='ellipsis';lbl.style.whiteSpace='nowrap';
        const num=el('input');num.type='number';num.className='num-inline';num.step='any';
        num.value=isEx?eff.exceptions[url]:eff.defaultSize;num.min=8;num.max=10000;num.disabled=!isEx;
        tog.addEventListener('change',()=>{
          if(tog.checked){eff.exceptions[url]=parseFloat(num.value)||eff.defaultSize;num.disabled=false}
          else{delete eff.exceptions[url];num.disabled=true}
        });
        num.addEventListener('input',()=>{if(tog.checked)eff.exceptions[url]=parseFloat(num.value)||eff.defaultSize});
        r.appendChild(tog);r.appendChild(lbl);r.appendChild(num);
        exBox.appendChild(r);
      });
      container.appendChild(exBox);
    }
  }

  if(eff.type==='none'){
    const info=el('div',null,'<span class="status-tag ok">Plain star spawning — no special behaviour</span>');
    container.appendChild(info);
  }
}

function updateCharDivByIndex(idx,ch){
  const layer=document.getElementById('bubble-editor-layer');
  const div=layer.querySelector(`.char-editor[data-idx="${idx}"]`);
  if(div)updateCharDiv(div,ch);
}

function activateEffect(id){
  cfg.activeEffectId=id;
  const eff=getActiveEffect();
  if(!eff)return;
  if(eff.type==='images'&&!eff.loaded)loadEffectImages(eff);
  if(eff.type==='bubble')computeBubbleMask(eff);
  resetStars();
  renderEffectList();
  rebuildBubbleEditor();
}
function deleteEffect(id){
  if(cfg.effects.length<=1){alert('Must keep at least one effect.');return}
  if(!confirm('Delete this effect?'))return;
  const wasActive=cfg.activeEffectId===id;
  cfg.effects=cfg.effects.filter(e=>e.id!==id);
  if(wasActive){
    cfg.activeEffectId=cfg.effects[0].id;
    const f=getActiveEffect();
    if(f&&f.type==='images'&&!f.loaded)loadEffectImages(f);
    if(f&&f.type==='bubble')computeBubbleMask(f);
    rebuildBubbleEditor();
  }
  renderEffectList();
}

}
